<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D1D1D">
<title>NTE Ledger</title>
<style>
:root{--bg:#1D1D1D;--p:#242424;--p2:#282828;--line:#343434;--tx:#f2f2f2;--mu:#9a9a9a;--dn:#a3a3a3;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sal:env(safe-area-inset-left,0px);--sab:max(env(safe-area-inset-bottom,0px),14px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#wm{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
#wm img{display:block;width:min(50vw,270px);height:auto;opacity:.13}
body.hasl #wm img{display:block}
#app{position:relative;z-index:1;height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
.tl{display:flex;align-items:center;gap:11px}
.lg{display:block;flex:none}
.lg img{display:block;width:42px;height:42px;object-fit:contain}
.ph{width:36px;height:36px;border:1px dashed #555;border-radius:10px;display:grid;place-items:center;font-size:8px;letter-spacing:.08em;color:#6a6a6a}
.title{font-weight:700;font-size:20px;letter-spacing:.02em}
#dt{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
#dash,#ghost{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 8px;display:grid;grid-template-columns:1fr;gap:9px;align-content:start}
.card{background:#242424a8;border:1px solid var(--line);border-radius:20px;padding:15px 16px;animation:in .62s cubic-bezier(.2,.9,.3,1) both}
.full{grid-column:1/-1}
@keyframes in{0%{opacity:0;transform:translate(var(--cx,0px),16px) scale(.975)}55%{opacity:1;transform:translate(0,-2px) scale(1.004)}100%{opacity:1;transform:none}}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:var(--mu)}
.dl{letter-spacing:0;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:#fff;font-weight:700}.dn{color:var(--dn);font-weight:700}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0 4px}
svg.ch2{width:100%;height:auto;display:block;margin:4px 0 8px;overflow:visible}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s cubic-bezier(.3,.7,.2,1) calc(var(--fxd,0s) + .15s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.nochart{height:84px;display:grid;place-items:center;color:#5f5f5f;font-size:12px;margin:4px 0 8px;border:1px dashed var(--line);border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.bl{font-size:11px;color:var(--mu);letter-spacing:.1em}
.lgd{display:flex;gap:16px;font-size:11px;color:var(--mu)}
.lgd i{display:inline-block;width:16px;border-top:2px solid;vertical-align:middle;margin-right:5px}
.tbl{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px 10px;font-size:12px;color:var(--mu);margin:4px 0 14px}
.tbl b{color:var(--tx);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tbl .hd{text-align:right;font-size:10px;letter-spacing:.1em}
.gls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ax{font-size:8px;fill:#777}
#dash.na .card{animation:none}
.src{padding:9px 0;border-bottom:1px solid #ffffff0d}.src:last-child{border:0}
.sn b{font-size:13px}.sn small{color:var(--mu);font-size:11px;margin-left:8px}
.sf{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sf label{font-size:10px;color:var(--mu);display:flex;flex-direction:column;gap:2px;flex:1;min-width:88px;letter-spacing:.05em}
.sf input{width:100%;padding:7px 10px;border-radius:10px;font-size:13px;background:var(--p2);border:1px solid #333;color-scheme:dark;font-variant-numeric:tabular-nums}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 0}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.h{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.h:last-child{border:0}.h span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h small{color:var(--mu);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.h u{text-decoration:none;font-size:10px;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px}
.h em{font-style:normal;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hint{color:#6a6a6a;font-size:11px;line-height:1.8;text-align:center;padding:4px 8px}
.empty{color:#5f5f5f;text-align:center;padding:14px 0;font-size:12px}
/* ephemeral chat */
#log{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 62px + var(--kl,0px));padding:0 16px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.m{max-width:88%;word-break:break-word;animation:pop .35s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:0 8px 24px #0006}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.m.out{animation:out .45s ease forwards}
@keyframes out{to{opacity:0;transform:translateY(-8px) scale(.97)}}
.m.a{align-self:flex-start;background:#2c2c2c;border:1px solid #3c3c3c;padding:10px 14px;border-radius:6px 18px 18px 18px}
.m.u{align-self:flex-end;background:#f2f2f2;color:#1D1D1D;font-weight:600;padding:8px 15px;border-radius:18px 18px 6px 18px}
.mu{color:var(--mu);font-size:12px}
.dots i{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:#aaa;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
.inp{display:flex;gap:10px;padding:8px 16px 4px;align-items:center;position:relative;z-index:6}
input{flex:1;min-width:0;background:var(--p2);border:1px solid #333;color:var(--tx);border-radius:26px;padding:14px 20px;font:inherit;transition:border-color .2s}
input::placeholder{color:#6d6d6d}
input:focus{outline:0;border-color:#666}
#send{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;background:#f2f2f2;color:#1D1D1D;flex:none;display:grid;place-items:center}
#send:active{transform:scale(.9)}
#send svg{width:20px;height:20px}
.card{padding:12px 14px}
#dash,#ghost{gap:10px;padding:2px 14px 10px}
.big{font-size:28px;margin:0 0 2px}
.two{margin-top:2px}
svg.ch2{margin:2px 0 4px}
.lgd{margin-bottom:8px;flex-wrap:nowrap;gap:2px 9px;white-space:nowrap}
.tbl{gap:4px 10px;margin:6px 0 6px}
.h{padding:5px 0}
.inp{z-index:9}
#log{z-index:8}
#shw{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none;transition:opacity .16s}
#shw.open{opacity:1;pointer-events:auto}
#shbd{position:absolute;inset:0;background:#000a;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 66px + var(--kl,0px));max-height:calc(100% - var(--sab) - var(--sat) - 120px - var(--kl,0px));overflow-y:auto;background:#262626;border:1px solid #3a3a3a;border-radius:22px;padding:14px 16px 8px;transform:translateY(26px) scale(.97);transition:transform .38s cubic-bezier(.2,.9,.3,1.1)}
#shw.open #sheet{transform:none}
.sh-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sh-h b{font-size:15px}.sh-h .mu{flex:1}
#shx{color:var(--mu);font-size:16px;cursor:pointer;padding:0 4px}
@media (max-height:2000px){
.top{padding:8px 16px 4px}.title{font-size:17px}.lg img{width:34px;height:34px}
#dash,#ghost{gap:8px;padding:2px 12px 8px}
.card{padding:9px 12px;border-radius:16px}
.big{font-size:23px;margin:0}.bl{font-size:10px}
svg.ch2{margin:0 0 2px}
.lgd{margin-bottom:5px;font-size:9.5px}
.tbl{gap:2px 10px;font-size:11.5px;margin:4px 0 4px}
.h{padding:3px 0;font-size:12px}
.gl{font-size:10px}
.inp{padding:6px 12px 4px}
input{padding:11px 16px}#send{width:44px;height:44px}
#log{bottom:calc(var(--sab) + 56px + var(--kl,0px))}
#sheet{bottom:calc(var(--sab) + 60px + var(--kl,0px))}
}
.sw{display:inline-block;width:12px;height:3px;border-radius:2px;border:0!important;margin-right:5px;vertical-align:middle}
.ci{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:4px}
.ci.sm{width:13px;height:13px;margin-right:3px;vertical-align:-2px}
.bl .ci{width:20px;height:20px;vertical-align:-5px;margin-right:5px}
.rm{color:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.gs{font-size:10px;color:var(--mu);margin-top:3px}
.pv{width:46px;height:46px;border:1px dashed #555;border-radius:12px;display:grid;place-items:center;color:#777;font-size:18px;overflow:hidden;margin-top:3px}
.pv img{width:100%;height:100%;object-fit:contain}
.ip{cursor:pointer}
.wl{display:flex;align-items:baseline;gap:8px;margin:3px 0 4px;font-size:12px;color:var(--mu);letter-spacing:.08em}
.wl b{color:var(--tx);font-size:15px;letter-spacing:0;font-variant-numeric:tabular-nums}
.wl em{font-style:normal;margin-left:auto;font-size:11px;letter-spacing:0;font-variant-numeric:tabular-nums}
.wl em b{color:var(--tx);font-size:14px;margin-left:3px}
.wl em .ci{width:19px;height:19px;vertical-align:-5px;margin-right:2px}
.wl span,.wl b,.wl em{white-space:nowrap}
@media (max-height:2000px){.wl{margin:1px 0 2px}.wl b{font-size:14px}}
.gc{font-size:11px;color:var(--mu);margin:-2px 0 0}.gc b{color:var(--tx);font-size:13px;font-variant-numeric:tabular-nums}
.pl{font-weight:400;color:var(--mu);font-size:10.5px}
.fct{display:grid;grid-template-columns:44px repeat(var(--n),1fr);gap:0;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.fct>*{padding:7px 0;border-bottom:1px solid #ffffff0f}
.fct .lr{border-bottom:0}
.gls.one{grid-template-columns:1fr}
.slim{padding:9px 14px}.slim .h{padding:0;border:0;font-size:12.5px}
.fct .fh{font-size:10px;letter-spacing:.04em;color:var(--mu);text-align:right;padding:2px 0 7px;display:flex;justify-content:flex-end;align-items:center;gap:5px;white-space:nowrap}
.fct .fh i{display:inline-block;width:14px;height:3px;border-radius:2px}
.fct .fl{font-size:11px;color:var(--mu);display:flex;align-items:center}
.fct b{display:flex;align-items:center;justify-content:flex-end}
.fct b{font-weight:600;font-size:13px;text-align:right;white-space:nowrap;padding-left:8px}
.fct .fh{padding-left:8px}
.fct b.avg{color:var(--mu);font-weight:500;font-size:12px}
.fct .em{font-size:13.5px;font-weight:700}.fct .fl.em{color:var(--tx);font-weight:600;font-size:11px}
.fct small{color:var(--mu);font-weight:400;font-size:10px;margin-left:4px}
@media (max-height:2000px){.fct>*{padding:3.5px 0}.fct .fh{padding:1px 0 4px}.fct{margin:5px 0 4px}}
html,body{overscroll-behavior:none}
@supports (height:100dvh){html,body,#app{height:100dvh}}
.cw{position:relative}
.av{position:absolute;left:14px;top:2px;font-size:10px;line-height:1.5;color:var(--mu);pointer-events:none;padding:2px 12px 3px 4px;border-radius:8px;background:linear-gradient(90deg,#1d1d1dd9 70%,#1d1d1d00)}
.av .t{font-size:9px;letter-spacing:.12em;margin-bottom:1px}
.av .t em{font-style:normal;letter-spacing:0;color:#6d6d6d;margin-left:6px;font-size:9px}
.av b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;margin-left:3px}
.av i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.ch2.still .ln{animation:none;stroke-dashoffset:0}
.title .sub{font-weight:500;color:var(--mu);font-size:14px;margin-left:9px;letter-spacing:.04em}
.vs{animation:vsw .36s cubic-bezier(.2,.8,.2,1)}
@keyframes vsw{from{opacity:0;transform:translateX(var(--dx,14px))}}
.bu,.bd{transform-box:fill-box;animation:gw .78s cubic-bezier(.2,1.35,.4,1) both}
.bu{transform-origin:50% 100%}.bd{transform-origin:50% 0}
@keyframes gw{from{transform:scaleY(0)}}
.ach.still .bu,.ach.still .bd{animation:none}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.bt{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;color:var(--mu);padding:4px 0 2px}
.bt b{color:var(--tx);font-weight:600;font-size:11px;letter-spacing:0;font-variant-numeric:tabular-nums}
.br{position:relative;display:flex;justify-content:space-between;gap:8px;padding:4px 0 6px;font-size:12px;font-variant-numeric:tabular-nums}
.br span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}
.br b{font-weight:600;white-space:nowrap}
.br::after{content:"";position:absolute;left:0;bottom:2px;height:2px;width:var(--p);background:#ffffff3d;border-radius:2px}
.il{font-size:11.5px;line-height:1.5;padding:2px 0;color:#d7d7d7}
.il b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
#nb{padding:0 14px;display:flex;flex-direction:column;gap:6px}#nb:empty{display:none}
.nt{display:flex;align-items:center;gap:10px;background:#2b2b2b;border:1px solid #444;border-radius:14px;padding:7px 8px 7px 12px;animation:pop .35s cubic-bezier(.2,.9,.3,1.1) both}
.nt.nag{border-color:#8a8a8a}
.nd{width:7px;height:7px;border-radius:50%;background:#fff;flex:none;animation:pls 2.2s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 #ffffff77}70%,100%{box-shadow:0 0 0 7px #fff0}}
.nm{flex:1;min-width:0;font-size:12.5px;line-height:1.35;font-weight:600}
.nm small{display:block;color:var(--mu);font-size:10.5px;font-weight:400}
.nx{color:var(--mu);padding:4px 7px;cursor:pointer;font-size:13px}
.nmore{font-size:10.5px;color:var(--mu);text-align:right;padding-right:6px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl2{background:#242424a8;border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.tl2.w2{grid-column:1/-1}
.tl2h{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:5px}
.tl2h .ci{width:17px;height:17px;margin:0}
.tl2v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.25;margin-top:1px}
.tl2s{font-size:10.5px;color:var(--mu);line-height:1.5;font-variant-numeric:tabular-nums}
.tl2 .bar{margin-top:5px}
.stc{display:flex;align-items:center;gap:11px}
.stc .sd{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid #777}
.stc .sd.ok{background:#fff;border-color:#fff;box-shadow:0 0 10px #ffffff66}
.stc b{font-size:14px}.stc small{display:block;color:var(--mu);font-size:11px;font-weight:400;font-variant-numeric:tabular-nums}
.nx2{padding:6px 0 4px}
.nx2h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.nx2h span{color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}.nx2h em{font-style:normal;color:var(--tx);font-weight:700;margin-left:8px}
.nx2 .bar{margin:5px 0 3px}.nx2 small{color:var(--mu);font-size:10.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cc{border-radius:10px;padding:4px 0 2px;text-align:center;background:#ffffff08}
.cc.ev{background:#ffffff1c}.cc.td{outline:1.5px solid #fff}
.cc small{display:block;font-size:9px;color:var(--mu);line-height:1.2}
.cc b{display:block;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.3}
.cc span{display:block;font-size:9px;height:11px;line-height:11px;letter-spacing:1px}
.calg{font-size:10px;color:var(--mu);margin-top:6px}
.tight .card{padding:7px 12px}.tight .tl2{padding:6px 12px}.tight .tl2v{font-size:19px}.tight .nx2{padding:3px 0 2px}.tight .cc{padding:2px 0 1px}
.hn{font-size:10.5px;color:#6d6d6d;text-align:center;padding:2px 0}
*{-webkit-tap-highlight-color:transparent}
.card{border-radius:18px!important}
.tl2,.nt{border-radius:14px}
.ax{font-size:9px}.av .t{font-size:10px}.cc small{font-size:10px}
.nx{padding:10px 12px;margin:-4px -4px -4px 0}
#shx{padding:8px 10px;margin:-8px -6px -8px 0}
#sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#5a5a5a;margin:-4px auto 10px}
.dv{font-style:normal;margin-left:9px;white-space:nowrap}.dv .ci{margin-right:3px}
.hp{font-size:12.5px;line-height:1.75}.hp b{display:inline-block;min-width:4.2em;color:var(--mu);font-weight:500;font-size:11px}
.title{font-size:15px!important;font-weight:600;color:var(--mu);letter-spacing:.08em}
.fct{grid-template-columns:44px repeat(var(--n),minmax(0,1fr))!important}
.fct b.mm{font-size:11px;font-weight:500;color:var(--mu);display:block;min-width:0}
.fct b.mm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.lg3{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;margin-top:6px}
.lg3 .lgt{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mu);white-space:nowrap}
.lg3 .lgt i{width:12px;height:3px;border-radius:2px;flex:none}
.lg3 small{display:block;font-size:10.5px;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.av2{position:absolute;left:2px;top:0;font-size:10px;color:var(--mu);white-space:nowrap}
.ins{padding-top:8px!important;padding-bottom:8px!important}
.fct b.two{flex-direction:column;align-items:flex-end;justify-content:center;gap:0;line-height:1.25}
.fct b.two small{font-size:10px;font-weight:400;color:var(--mu);letter-spacing:.02em}
/* ---- アニメーション強化 ---- */
.card{animation-delay:var(--fxd,0s)}#dash>:nth-child(2){animation-delay:calc(var(--fxd,0s) + .07s)}#dash>:nth-child(3){animation-delay:calc(var(--fxd,0s) + .14s)}#dash>:nth-child(4){animation-delay:calc(var(--fxd,0s) + .21s)}#dash>:nth-child(5){animation-delay:calc(var(--fxd,0s) + .28s)}
.tl2{animation:in .58s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--fxd,0s) + var(--i,0)*70ms + .1s)}
.tg>:nth-child(1){--i:0}.tg>:nth-child(2){--i:1}.tg>:nth-child(3){--i:2}.tg>:nth-child(4){--i:3}
.nx2{animation:in .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--fxd,0s) + .3s)}.nx2+.nx2{animation-delay:calc(var(--fxd,0s) + .38s)}
.cc{animation:in .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--fxd,0s) + var(--i,0)*24ms + .32s)}
#dash.na .card,#dash.na .tl2,#dash.na .nx2,#dash.na .cc{animation:none}
.title{display:inline-block}.title.tt{animation:ttl .4s cubic-bezier(.2,.9,.3,1)}
@keyframes ttl{from{opacity:0;transform:translateY(-6px)}}
.cuw{display:inline-block;transform-origin:left center}
.cuw.bump{animation:bump .65s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.08);text-shadow:0 0 16px #ffffffaa}100%{transform:scale(1);text-shadow:0 0 0 #fff0}}
@keyframes fadein{from{opacity:0}}@keyframes popdot{from{transform:scale(0)}}@keyframes grow2{from{transform:scaleY(0)}}
#wm img{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.17;transform:scale(1.04)}}
.stc .sd.ok{animation:pls 2.4s infinite}
.m{animation:pop .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
.nt{animation:ntin .5s cubic-bezier(.2,1.1,.3,1) both}
@keyframes ntin{from{opacity:0;transform:translateY(-12px) scale(.97)}}
.nt.nout{animation:ntout .22s ease forwards}
@keyframes ntout{to{opacity:0;transform:translateX(26px)}}
#send.sent svg{animation:fly .5s cubic-bezier(.3,.8,.3,1)}
@keyframes fly{0%{transform:translateY(0)}35%{transform:translateY(-16px);opacity:0}36%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
input{transition:border-color .2s,box-shadow .25s}input:focus{box-shadow:0 0 0 4px #ffffff1c}
#sheet.enter>*{animation:rowin .46s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--r,0)*34ms + .12s)}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
/* ---- 画面切り替え: NTE風 ---- */
#ghost{position:absolute;z-index:2;pointer-events:none;overflow:hidden;margin:0!important}
#ghost,#ghost *{animation:none!important;transition:none!important}
#ghost .ln{stroke-dashoffset:0!important}
.lg.fl img{animation:lgf .6s ease-out}
@keyframes lgf{0%{filter:none}28%{filter:brightness(2.4) drop-shadow(0 0 8px #fff)}100%{filter:none}}
.vk{--kl:max(0px,calc(var(--kb,0px) - var(--sab) + 4px))}
.vk .inp{transform:translateY(calc(-1 * var(--kl)));transition:transform .24s cubic-bezier(.2,.9,.3,1)}
.vk #log,.vk #sheet{transition:bottom .24s cubic-bezier(.2,.9,.3,1)}
/* ---- チャートの演出(走査・ポップ・ピング) ---- */
.ls{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hd{pointer-events:none;filter:drop-shadow(0 0 4px #fff)}
.ch2.rvl .dt,.ch2.rvl .tm{visibility:hidden}
.ch2.rvl.pop .dt{visibility:visible;transform-box:fill-box;transform-origin:center;animation:popdot .62s cubic-bezier(.2,1.6,.4,1) both}
.ch2.rvl.pop .tm{visibility:visible;transform-box:fill-box;transform-origin:50% 100%;animation:grow2 .6s cubic-bezier(.2,.9,.3,1) both}
.pg{opacity:0;fill:none}
.ch2.ping .pg{transform-box:fill-box;transform-origin:center;animation:pingr .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes pingr{0%{transform:scale(.7);opacity:.9}100%{transform:scale(3.8);opacity:0}}
#dash:not(.na) .av{animation:fadein .6s calc(var(--fxd,0s) + .3s) both}
#dash:not(.na) .lgd span{animation:fadein .5s both;animation-delay:calc(var(--fxd,0s) + 1.3s + var(--i,0)*100ms)}
.lgd span:nth-child(1){--i:0}.lgd span:nth-child(2){--i:1}.lgd span:nth-child(3){--i:2}
.ach:not(.still) .bl0{transform-box:fill-box;transform-origin:left;animation:grow3 .7s cubic-bezier(.2,.9,.3,1) calc(var(--fxd,0s) + .05s) both}
.ach:not(.still) .ax{animation:fadein .5s calc(var(--fxd,0s) + .55s) both}
@keyframes grow3{from{transform:scaleX(0)}}
/* ---- カード詳細 ---- */
[data-d]{cursor:pointer;transition:transform .16s cubic-bezier(.2,.9,.3,1),background .2s}
[data-d]:active{transform:scale(.972)}
.tl2{position:relative}
.tl2[data-d]::after{content:"›";position:absolute;right:11px;top:7px;color:#6a6a6a;font-size:17px;line-height:1}
.dh{padding:2px 0 4px}.dnum{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.ds{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.dc{margin:4px -2px 6px}.dc svg.ch2{margin:0}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-bottom:6px}
.dg>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mu);border-bottom:1px solid #ffffff0d;padding:6px 0}
.dg b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.dg small{color:var(--mu);font-weight:400;font-size:10px;margin-left:5px}
.dl2{margin-top:4px}
.dg>div.w{grid-column:1/-1}.dg span{white-space:nowrap}
.d2{padding:6px 0;border-bottom:1px solid #ffffff0d}.d2 b{font-size:12.5px}.d2 small{margin-left:8px;color:var(--mu);font-size:10.5px}.d2 .mu{font-size:11.5px;color:#cfcfcf;margin-top:1px;font-variant-numeric:tabular-nums}
/* ---- シート(ポップアップ)の表示・非表示 ---- */
#shw{opacity:1;visibility:hidden;pointer-events:none;transition:visibility 0s linear .38s}
#shw.open{visibility:visible;pointer-events:auto;transition-delay:0s}
#shbd{opacity:0;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:opacity .3s ease,backdrop-filter .3s ease,-webkit-backdrop-filter .3s ease}
#shw.open #shbd{opacity:1;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition-duration:.4s}
#sheet,.vk #sheet{transform-origin:50% 100%;transform:translateY(72px) scale(.9);opacity:0;will-change:transform,opacity;transition:transform .34s cubic-bezier(.55,0,.85,.4),opacity .24s ease-in,bottom .24s cubic-bezier(.2,.9,.3,1)}
#shw.open #sheet,.vk #shw.open #sheet{transform:none;opacity:1;transition:transform .66s cubic-bezier(.2,1.5,.36,1),opacity .26s ease-out,bottom .24s cubic-bezier(.2,.9,.3,1)}
#sheet::before{content:none!important}
.grab{height:22px;margin:-8px -16px 0;position:relative;touch-action:none;cursor:grab}
.grab::before{content:"";position:absolute;left:50%;top:9px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:#5a5a5a;transition:background .2s,width .2s}
.grab:active::before{background:#9a9a9a;width:46px;margin-left:-23px}
.sh-h{touch-action:none}
/* ---- 吹き出しの消え方 ---- */
.m.out{animation:out .4s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes out{to{opacity:0;transform:translateY(-12px) scale(.92);filter:blur(3px)}}
#sheet{touch-action:pan-y}#sheet.ns{touch-action:none}.grab,.sh-h{touch-action:none}

.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.ct:active{transform:scale(.95)}

#dash.na .ct.new{animation:in .6s cubic-bezier(.2,1.4,.4,1) both}
.ct.r5{border-color:#7d7d7d;box-shadow:inset 0 0 20px #ffffff10}
.cav{width:46px;height:46px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#4c4c4c,#272727);border:2px solid #555;font-weight:800;font-size:19px}

.cn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:9.5px;letter-spacing:1px;color:#d4d4d4;line-height:1.4}
.cl{font-size:10.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{display:flex;justify-content:center;gap:3px;margin-top:5px}.cp i{width:6px;height:6px;border-radius:50%;background:#383838}.cp i.on{background:#f2f2f2;box-shadow:0 0 5px #ffffff88}
.ct.add{border-style:dashed;color:var(--mu);background:none}.ct.add .cav{border-style:dashed;background:none;font-size:22px;color:var(--mu);box-shadow:none}
.cst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.cst div{text-align:center}.cst b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.cst small{font-size:10px;color:var(--mu)}
.chero{display:flex;gap:14px;align-items:center;margin:2px 0 10px}.cn2{font-size:20px;font-weight:700}
.sf label.w{flex-basis:100%}
.cdel{text-align:center;color:var(--mu);font-size:12px;padding:14px 0 8px;margin-top:6px;border-top:1px solid #ffffff0d;cursor:pointer}

.cu{font-size:9px;color:var(--mu);margin-top:2px;letter-spacing:.02em}

.bf{right:4px;color:#6a6a6a;font-size:14px;transition:color .2s,text-shadow .2s}

.cst{grid-template-columns:repeat(4,1fr)!important;gap:4px!important;margin-top:8px}

.mm2{display:block;font-size:10px;color:var(--mu);letter-spacing:.05em;margin-top:10px}

/* 実績と定期収入の差(補正): 完了した日ごとに「実績の増減 − その日の定期収入」を出し、新しい日ほど重くして平均する */
function flowStats(c){
  if(!S.log.length)return null;
  const today=startOf(new Date()),first=startOf(new Date(S.log[0].t)),t0=first>addD(today,-29)?first:addD(today,-29),n=dnum(today)-dnum(t0);
  if(n<3)return null;
  const net=Array(n).fill(0);
  of(c).forEach(e=>{const i=dnum(startOf(new Date(e.t)))-dnum(t0);if(i>=0&&i<n)net[i]+=e.a});
  let sw=0,sr=0;
  for(let i=0;i<n;i++){const w=Math.pow(.5,(n-1-i)/10);sw+=w;sr+=w*(net[i]-inc(c,addD(t0,i)))}
  const resid=sr/sw,conf=Math.min(1,n/14);
  return {resid,conf,n,adj:resid*conf};
}
const basis=()=>{const m=S.fcMode;if(m==='sched')return 'sched';if(m==='obs')return obs('f')?'obs':'sched';return flowStats('f')?'blend':'sched'};
const basisLabel=()=>({blend:'実績＋定期',obs:'実績',sched:'定期収入'})[basis()];
const basisDays=()=>{const b=basis();return b==='blend'?flowStats('f').n:b==='obs'?obs('f').days:0};
const adjOf=c=>basis()==='blend'?((flowStats(c)||{adj:0}).adj):0;

function fc(c,n){

  if(bs==='obs'){const o=obs(c);if(o){const a=[];for(let i=1;i<=n;i++)a.push(Math.max(0,Math.round(b0+o.v*i)));return a}}
  const adj=bs==='blend'?adjOf(c):0,t=startOf(new Date()),a=[];let b=b0;
  for(let i=1;i<=n;i++){b+=inc(c,addD(t,i))+adj;a.push(Math.max(0,Math.round(b)))}
  return a;
}

  if(bs==='obs'){const o=obs(c);if(!o||o.v<=0)return '増加傾向なし';const d=Math.ceil((g-b)/o.v);return d>730?'2年以内に到達しません':dt(d)}

  let x=b;const t=startOf(new Date());for(let i=1;i<=730;i++){x+=inc(c,addD(t,i))+adj;if(x>=g)return dt(i)}return '2年以内に到達しません';
}

function chartCalc(){

  const start=first<addD(t,-13)?addD(t,-13):first,P=dnum(t)-dnum(start),N=P+F+1;
  const mk=c=>{
    let pre=S.open[c]||0;const net={};
    of(c).forEach(e=>{const d=startOf(new Date(e.t));if(d<start)pre+=e.a;else{const k=ymd(d);net[k]=(net[k]||0)+e.a}});
    const past=[];let b=pre;for(let i=0;i<=P;i++){b+=net[ymd(addD(start,i))]||0;past.push(b)}
    const V=past.concat(fc(c,F)),g=S.goals[c];
    let mx=Math.max(...V,g>0?g:-Infinity),mn=c==='b'?Math.min(...V):Math.min(...V,0);if(mx===mn)mx=mn+1;
    return {V,mx,mn,g};

  const A=mk('f'),B=mk('e'),hasB=!!(S.open.b||of('b').length),C=hasB?mk('b'):null;

  const area=o=>`${path(o,0,N-1)}L${X(N-1)} ${H-bot}L${X(0)} ${H-bot}Z`;

  <linearGradient id="cgf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="0"><stop offset="0" stop-color="#a8721a"/><stop offset=".5" stop-color="#fccc54"/><stop offset="1" stop-color="#fff0a8"/></linearGradient>

function chart(){

  chartMemo={N:c.N,P:c.P,H:c.H,calc:c,s:{f:sm(A),e:sm(B),b:sm(C)}};

function armChart(D){if(noMotion())return;D.querySelectorAll('svg.rvl').forEach(sv=>{const r=sv.querySelector('.rv');if(r)r.setAttribute('width','0')})}
function playChart(D,tok,ref){
  ref=ref||CHREF;if(tok!==ref.t||noMotion())return;
  const sv=D.querySelector('svg.rvl');if(!sv)return;
  const r=sv.querySelector('.rv'),h=sv.querySelector('.hd'),W=300,xp=+sv.dataset.xp,DUR=1500,t0=performance.now();let popped=false;
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  (function f(t){
    if(tok!==ref.t||!sv.isConnected)return;
    const u=Math.min(1,(t-t0)/DUR),x=W*ease(u);
    r.setAttribute('width',x.toFixed(1));h.setAttribute('x1',x.toFixed(1));h.setAttribute('x2',x.toFixed(1));h.setAttribute('opacity',(u<.9?.85:Math.max(0,(1-u)/.1)*.85).toFixed(2));
    if(!popped&&x>=xp-1){popped=true;sv.classList.add('pop')}
    if(u<1)requestAnimationFrame(f);else{r.setAttribute('width',W);h.setAttribute('opacity','0');sv.classList.add('pop')}
  })(t0);
}
function morphChart(D){

  if(!pm||!cm||pm.N!==cm.N||pm.P!==cm.P||noMotion()||!D.querySelector('svg.ch2'))return;
  const tok=++morphTok,keys=['f','e','b'].filter(k=>pm.s[k]&&cm.s[k]),t0=performance.now(),DUR=560;
  (function f(t){
    if(tok!==morphTok)return;
    const u=Math.min(1,(t-t0)/DUR),e=1-Math.pow(1-u,3),over={};
    keys.forEach(k=>{const a=pm.s[k],b=cm.s[k];over[k]={V:b.V.map((v,i)=>a.V[i]+(v-a.V[i])*e),mx:a.mx+(b.mx-a.mx)*e,mn:a.mn+(b.mn-a.mn)*e,g:b.g}});

function undoImport(){
  const b=localStorage.getItem('nte_fans_bak');
  if(!b)return bot('戻せるバックアップがありません。',{ms:2800});
  try{localStorage.setItem('nte_fans',b);localStorage.removeItem('nte_fans_bak');sessionStorage.setItem('nte_imp','undo')}catch(e){return bot('戻せませんでした。',{ms:2800})}
  bot('元に戻しています…',{ms:900});setTimeout(()=>location.reload(),500);
}
function readImport(file){
  clearTimeout(fadeT);fadeAll();
  (file.text?file.text():new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ng;r.readAsText(file)})).then(askImport).catch(()=>bot('ファイルを読み込めませんでした。'));
}
$('#impf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readImport(f)};
document.addEventListener('paste',e=>{const t=(e.clipboardData&&e.clipboardData.getData('text'))||'';if(t.trim()[0]==='{'&&t.indexOf('"nte-ledger"')>0){e.preventDefault();askImport(t)}});
try{const f=sessionStorage.getItem('nte_imp');if(f){sessionStorage.removeItem('nte_imp');setTimeout(()=>bot(f==='undo'?'インポート前の状態に戻しました。':'読み込みました。<div class="mu">「インポート取り消し」で元に戻せます</div>',{ms:4600}),700)}}catch(e){}
if(navigator.virtualKeyboard){try{const vk=navigator.virtualKeyboard;vk.overlaysContent=true;document.documentElement.classList.add('vk');const upKb=()=>document.documentElement.style.setProperty('--kb',Math.round(vk.boundingRect.height)+'px');vk.addEventListener('geometrychange',upKb);upKb()}catch(e){}}
let rzT,pendRefit=false;const refit=()=>{if(document.activeElement&&document.activeElement.id==='q'){pendRefit=true;return}clearTimeout(rzT);rzT=setTimeout(renderDash,160)};$('#q').addEventListener('blur',()=>{if(pendRefit){pendRefit=false;refit()}});addEventListener('resize',refit);addEventListener('orientationchange',refit);if(window.visualViewport)visualViewport.addEventListener('resize',refit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
</script>
</body>
</html>
