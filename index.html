<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D1D1D">
<title>NTE Ledger</title>
<style>
:root{--bg:#1D1D1D;--p:#242424;--p2:#282828;--line:#343434;--tx:#f2f2f2;--mu:#858585;--dn:#a3a3a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#wm{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
#wm img{display:block;width:min(78vw,420px);height:auto;opacity:.1}
body.hasl #wm img{display:block}
#app{position:relative;z-index:1;height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
.tl{display:flex;align-items:center;gap:11px}
.lg{display:block;flex:none}
.lg img{display:block;width:42px;height:42px;object-fit:contain}
.ph{width:36px;height:36px;border:1px dashed #555;border-radius:10px;display:grid;place-items:center;font-size:8px;letter-spacing:.08em;color:#6a6a6a}
.title{font-weight:700;font-size:20px;letter-spacing:.02em}
#dt{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
#dash{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-content:start}
.card{background:#242424a8;border:1px solid var(--line);border-radius:20px;padding:15px 16px;animation:in .5s both}
.card:nth-child(2){animation-delay:.08s}
.full{grid-column:1/-1}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:var(--mu)}
.dl{letter-spacing:0;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:#fff;font-weight:700}.dn{color:var(--dn);font-weight:700}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0 4px}
svg.ch2{width:100%;height:auto;display:block;margin:4px 0 8px;overflow:visible}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s .15s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.nochart{height:84px;display:grid;place-items:center;color:#5f5f5f;font-size:12px;margin:4px 0 8px;border:1px dashed var(--line);border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.bl{font-size:11px;color:var(--mu);letter-spacing:.1em}
.lgd{display:flex;gap:16px;font-size:11px;color:var(--mu)}
.lgd i{display:inline-block;width:16px;border-top:2px solid;vertical-align:middle;margin-right:5px}
.tbl{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px 10px;font-size:12px;color:var(--mu);margin:4px 0 14px}
.tbl b{color:var(--tx);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tbl .hd{text-align:right;font-size:10px;letter-spacing:.1em}
.gls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ax{font-size:8px;fill:#777}
#dash.na .card{animation:none}
.src{padding:9px 0;border-bottom:1px solid #ffffff0d}.src:last-child{border:0}
.sn b{font-size:13px}.sn small{color:var(--mu);font-size:11px;margin-left:8px}
.sf{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sf label{font-size:10px;color:var(--mu);display:flex;flex-direction:column;gap:2px;flex:1;min-width:88px;letter-spacing:.05em}
.sf input{width:100%;padding:7px 10px;border-radius:10px;font-size:13px;background:var(--p2);border:1px solid #333;color-scheme:dark;font-variant-numeric:tabular-nums}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 0}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.h{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.h:last-child{border:0}.h span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h small{color:var(--mu);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.h u{text-decoration:none;font-size:10px;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px}
.h em{font-style:normal;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hint{color:#6a6a6a;font-size:11px;line-height:1.8;text-align:center;padding:4px 8px}
.empty{color:#5f5f5f;text-align:center;padding:14px 0;font-size:12px}
/* ephemeral chat */
#log{position:absolute;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:0 16px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.m{max-width:88%;word-break:break-word;animation:pop .35s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:0 8px 24px #0006}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.m.out{animation:out .45s ease forwards}
@keyframes out{to{opacity:0;transform:translateY(-8px) scale(.97)}}
.m.a{align-self:flex-start;background:#2c2c2c;border:1px solid #3c3c3c;padding:10px 14px;border-radius:6px 18px 18px 18px}
.m.u{align-self:flex-end;background:#f2f2f2;color:#1D1D1D;font-weight:600;padding:8px 15px;border-radius:18px 18px 6px 18px}
.mu{color:var(--mu);font-size:12px}
.dots i{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:#aaa;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
.inp{display:flex;gap:10px;padding:8px 16px 14px;align-items:center;position:relative;z-index:6}
input{flex:1;min-width:0;background:var(--p2);border:1px solid #333;color:var(--tx);border-radius:26px;padding:14px 20px;font:inherit;transition:border-color .2s}
input::placeholder{color:#6d6d6d}
input:focus{outline:0;border-color:#666}
#send{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;background:#f2f2f2;color:#1D1D1D;flex:none;display:grid;place-items:center}
#send:active{transform:scale(.9)}
#send svg{width:20px;height:20px}
.card{padding:12px 14px}
#dash{gap:10px;padding:2px 14px 10px}
.big{font-size:28px;margin:0 0 2px}
.two{margin-top:2px}
svg.ch2{max-height:var(--ch,168px);margin:2px 0 4px}
.lgd{margin-bottom:8px}
.tbl{gap:4px 10px;margin:6px 0 6px}
.h{padding:5px 0}
.inp{z-index:9}
#log{z-index:8}
#shw{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none;transition:opacity .25s}
#shw.open{opacity:1;pointer-events:auto}
#shbd{position:absolute;inset:0;background:#000a;backdrop-filter:blur(3px)}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 130px);overflow-y:auto;background:#262626;border:1px solid #3a3a3a;border-radius:22px;padding:14px 16px 8px;transform:translateY(26px) scale(.97);transition:transform .38s cubic-bezier(.2,.9,.3,1.1)}
#shw.open #sheet{transform:none}
.sh-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sh-h b{font-size:15px}.sh-h .mu{flex:1}
#shx{color:var(--mu);font-size:16px;cursor:pointer;padding:0 4px}
@media (max-height:720px){
.top{padding:8px 16px 4px}.title{font-size:17px}.lg img{width:34px;height:34px}
#dash{gap:8px;padding:2px 12px 8px}
.card{padding:9px 12px;border-radius:16px}
.big{font-size:23px;margin:0}.bl{font-size:10px}
svg.ch2{max-height:var(--ch,116px);margin:0 0 2px}
.lgd{margin-bottom:5px;font-size:10px}
.tbl{gap:2px 10px;font-size:11.5px;margin:4px 0 4px}
.h{padding:3px 0;font-size:12px}
.gl{font-size:10px}
.inp{padding:6px 12px 10px}
input{padding:11px 16px}#send{width:44px;height:44px}
#log{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
#sheet{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px;border:0!important;margin-right:5px;vertical-align:middle}
.ci{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:4px}
.ci.sm{width:13px;height:13px;margin-right:3px;vertical-align:-2px}
.bl .ci{width:20px;height:20px;vertical-align:-5px;margin-right:5px}
.rm{color:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.gs{font-size:10px;color:var(--mu);margin-top:3px}
.pv{width:46px;height:46px;border:1px dashed #555;border-radius:12px;display:grid;place-items:center;color:#777;font-size:18px;overflow:hidden;margin-top:3px}
.pv img{width:100%;height:100%;object-fit:contain}
.ip{cursor:pointer}
.wl{display:flex;align-items:baseline;gap:8px;margin:3px 0 4px;font-size:12px;color:var(--mu);letter-spacing:.08em}
.wl b{color:var(--tx);font-size:15px;letter-spacing:0;font-variant-numeric:tabular-nums}
.wl em{font-style:normal;margin-left:auto;font-size:11px;letter-spacing:0;font-variant-numeric:tabular-nums}
@media (max-height:720px){.wl{margin:1px 0 2px}.wl b{font-size:14px}}
</style>
</head>

const ico=(c,k='')=>ICON[c]?`<img class="ci ${k}" src="${ICON[c]}" alt="">`:'';
const CUR={f:'ファンス',e:'円石'},COL={f:'#ffffff',e:'#b9b9b9'};
const p2=x=>String(x).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dnum=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const strD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const startOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const nextMon=()=>{let d=startOf(new Date());while(d.getDay()!==1)d=addD(d,1);return ymd(d)};
const SRC=()=>[
 {id:'daily',n:'デイリー',k:[],f:20000,e:60,t:'d',lb:'毎日'},
 {id:'coffee',n:'壱のコーヒー',k:['コーヒー','壱'],f:0,e:0,t:'d',lb:'毎日'},
 {id:'stamina',n:'シティスタミナ',k:['スタミナ'],f:0,e:0,t:'w',lb:'毎週月曜'},
 {id:'million',n:'プロジェクトミリオン',k:['ミリオン'],f:0,e:0,t:'b',lb:'14日ごと(月曜)',anchor:nextMon()}];
let S={v:5,log:[],goals:{f:0,e:0},all:false,src:SRC(),rcv:{},open:{f:0,e:0,w:0,set:false}};
try{const r=JSON.parse(localStorage.getItem('nte_fans')||'null');if(r){S.log=r.log||[];S.goals=r.goals||{f:r.goal||0,e:0};S.rcv=r.rcv||{};if(r.open)S.open=Object.assign(S.open,r.open);(r.src||[]).forEach(o=>{const s=S.src.find(x=>x.id===o.id);if(s){s.f=+o.f||0;s.e=+o.e||0;if(o.anchor)s.anchor=o.anchor}})}}catch(e){}
const save=()=>{try{localStorage.setItem('nte_fans',JSON.stringify({v:5,log:S.log,goals:S.goals,open:S.open,rcv:S.rcv,src:S.src.map(s=>({id:s.id,f:s.f,e:s.e,anchor:s.anchor}))}))}catch(e){}};
const of=c=>S.log.filter(e=>(e.c||'f')===c);
const wealth=()=>(S.open.w||0)+of('f').filter(e=>e.a>0).reduce((a,e)=>a+e.a,0);
const bal=c=>(S.open[c]||0)+of(c).reduce((a,e)=>a+e.a,0);
const sum=(a,p)=>a.filter(p).reduce((x,e)=>x+e.a,0);
const shown={f:0,e:0};
const isToday=e=>new Date(e.t).toDateString()===new Date().toDateString();

const due=(s,d)=>{if(s.t==='d')return true;if(s.t==='w')return d.getDay()===1;const diff=dnum(d)-dnum(strD(s.anchor));return ((diff%14)+14)%14===0};
const inc=(c,d)=>S.src.reduce((a,s)=>a+(due(s,d)?(+s[c]||0):0),0);
const avg=c=>S.src.reduce((a,s)=>a+(+s[c]||0)/(s.t==='d'?1:s.t==='w'?7:14),0);
function fc(c,n){let b=bal(c);const t=startOf(new Date()),a=[];for(let i=1;i<=n;i++){b+=inc(c,addD(t,i));a.push(b)}return a}
function eta(c){const g=S.goals[c],b=bal(c);if(!(g>0))return '目標未設定';if(b>=g)return '達成済み';if(avg(c)<=0)return '定期収入が未設定';let x=b;const t=startOf(new Date());for(let i=1;i<=730;i++){x+=inc(c,addD(t,i));if(x>=g){const d=addD(t,i);return (d.getMonth()+1)+'/'+d.getDate()+'頃（'+i+'日後）'}}return '2年以内に到達しません'}
function nextDue(s){if(s.t==='d')return '';const t=startOf(new Date());for(let i=0;i<30;i++){const d=addD(t,i);if(due(s,d))return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）'}return ''}
function chart(){
  const t=startOf(new Date()),F=30;
  const first=S.log.length?startOf(new Date(S.log[0].t)):t;
  const start=first<addD(t,-13)?addD(t,-13):first,P=dnum(t)-dnum(start),N=P+F+1;
  const mk=c=>{
    let pre=S.open[c]||0;const net={};
    of(c).forEach(e=>{const d=startOf(new Date(e.t));if(d<start)pre+=e.a;else{const k=ymd(d);net[k]=(net[k]||0)+e.a}});
    const past=[];let b=pre;for(let i=0;i<=P;i++){b+=net[ymd(addD(start,i))]||0;past.push(b)}
    const V=past.concat(fc(c,F)),g=S.goals[c];
    let mx=Math.max(...V,g>0?g:-Infinity),mn=Math.min(...V,0);if(mx===mn)mx=mn+1;
    return {V,mx,mn,g};
  };
  const W=300,H=150,pd=8,top=14,bot=20,X=i=>pd+i*(W-pd*2)/(N-1);
  const A=mk('f'),B=mk('e');
  const Y=(o,v)=>(H-bot)-(v-o.mn)/(o.mx-o.mn)*(H-bot-top);
  const path=(o,i0,i1)=>{let d='';for(let i=i0;i<=i1;i++)d+=(i===i0?'M':'L')+X(i).toFixed(1)+' '+Y(o,o.V[i]).toFixed(1);return d};
  const L=(o,gid,w,under)=>`${under?`<path d="${path(o,0,P)}" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="${w+2.4}" stroke-linecap="round" stroke-linejoin="round"/>`:''}<path class="ln" pathLength="1" d="${path(o,0,P)}" stroke="url(#${gid})" style="stroke-width:${w}"/><path d="${path(o,P,N-1)}" fill="none" stroke="url(#${gid})" stroke-width="${w}" stroke-dasharray="3 4" stroke-linecap="round" opacity=".8"/>`;
  const lab=(i,txt,an)=>{const d=addD(start,i);return `<text class="ax" x="${X(i)}" y="${H-5}" text-anchor="${an}">${txt||(d.getMonth()+1)+'/'+d.getDate()}</text>`};
  const gl=(o,col)=>o.g>0?`<line x1="0" x2="${W}" y1="${Y(o,o.g)}" y2="${Y(o,o.g)}" stroke="${col}" stroke-opacity=".35" stroke-dasharray="1 4"/>`:'';
  const area=(o)=>`${path(o,0,N-1)}L${X(N-1)} ${H-bot}L${X(0)} ${H-bot}Z`;
  return `<svg class="ch2" viewBox="0 0 ${W} ${H}"><defs>
  <linearGradient id="cgf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="0"><stop offset="0" stop-color="#a8721a"/><stop offset=".5" stop-color="#fccc54"/><stop offset="1" stop-color="#fff0a8"/></linearGradient>
  <linearGradient id="cge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="0"><stop offset="0" stop-color="#2a54b0"/><stop offset=".55" stop-color="#4aa0f0"/><stop offset="1" stop-color="#8ff0ff"/></linearGradient>
  <linearGradient id="caf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fccc54" stop-opacity=".38"/><stop offset=".55" stop-color="#6b4a10" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="cae" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa0f0" stop-opacity=".3"/><stop offset="1" stop-color="#0c243c" stop-opacity="0"/></linearGradient></defs>
  <line x1="${X(P)}" x2="${X(P)}" y1="${top-4}" y2="${H-bot}" stroke="#555" stroke-dasharray="2 3"/>
  ${gl(A,'#fccc54')}${gl(B,'#71e7fb')}
  <path d="${area(B)}" fill="url(#cae)"/><path d="${area(A)}" fill="url(#caf)"/>
  ${L(B,'cge',2,false)}${L(A,'cgf',2.4,true)}
  <circle cx="${X(P)}" cy="${Y(B,B.V[P])}" r="7" fill="#71e7fb" opacity=".2"/><circle cx="${X(P)}" cy="${Y(B,B.V[P])}" r="3.2" fill="#8ff0ff"/>
  <circle cx="${X(P)}" cy="${Y(A,A.V[P])}" r="7" fill="#fccc54" opacity=".22"/><circle cx="${X(P)}" cy="${Y(A,A.V[P])}" r="3.6" fill="#fccc54" stroke="#000" stroke-opacity=".6"/>
  ${lab(0,'','start')}${P>3?lab(P,'今日','middle'):''}${lab(N-1,'','end')}</svg>
  <div class="lgd"><span><i class="sw" style="background:linear-gradient(90deg,#a8721a,#fccc54,#fff0a8)"></i>ファンス 〜${nf(A.mx)}</span><span><i class="sw" style="background:linear-gradient(90deg,#2a54b0,#4aa0f0,#8ff0ff)"></i>円石 〜${nf(B.mx)}</span><span><i style="border-color:#777;border-top-style:dashed"></i>予測</span></div>`;
}
function card(){
  const D={};['f','e'].forEach(c=>{const td=of(c).filter(isToday);D[c]={net:td.reduce((x,y)=>x+y.a,0),b:bal(c),g:S.goals[c]}});
  const pc=c=>D[c].g>0?Math.max(0,Math.min(100,Math.round(D[c].b/D[c].g*100))):0;
  const gl=c=>{const g=D[c].g,rem=Math.max(0,g-D[c].b);return `<div><div class="gl"><span>${CUR[c]}</span>${g>0?(rem>0?`<span>あと <b class="rm">${nf(rem)}</b></span>`:'<b class="rm">達成</b>'):'<span>目標なし</span>'}</div><div class="bar"><i data-w="${pc(c)}"></i></div>${g>0?`<div class="gs">目標 ${nf(g)}・${pc(c)}%</div>`:''}</div>`};
  return `<section class="card full"><div class="ch"><span>BALANCE</span><span class="dl">今日 ${D.f.net?sg(D.f.net):'±0'} ／ ${D.e.net?sg(D.e.net):'±0'}</span></div>
  <div class="two"><div><div class="bl">${ico('f')}ファンス</div><div class="big" id="bv_f">${nf(shown.f)}</div></div><div><div class="bl">${ico('e')}円石</div><div class="big" id="bv_e">${nf(shown.e)}</div></div></div>
  <div class="wl"><span>財力値</span><b>${nf(wealth())}</b><em>今日 +${nf(sum(of('f').filter(isToday),x=>x.a>0))}</em></div>
  ${chart()}<div class="gls">${gl('f')}${gl('e')}</div></section>`;
}
function fcCard(){
  const f=fc('f',30),e=fc('e',30);
  const r=h=>`<span>${h}日後</span><b>${nf(f[h-1])}</b><b>${nf(e[h-1])}</b>`;
  const anyG=S.goals.f>0||S.goals.e>0;
  return `<section class="card"><div class="ch"><span>FORECAST</span><span>定期収入のみで計算</span></div>
  <div class="tbl"><span></span><b class="hd">ファンス</b><b class="hd">円石</b>
  <span>平均/日</span><b>+${nf(Math.round(avg('f')))}</b><b>+${nf(Math.round(avg('e')))}</b>${r(7)}${r(14)}${r(30)}</div>
  ${anyG?`<div class="gl" style="display:block;line-height:1.7">${S.goals.f>0?`<div>ファンス目標：<b style="color:var(--tx);font-weight:600">${eta('f')}</b></div>`:''}${S.goals.e>0?`<div>円石目標：<b style="color:var(--tx);font-weight:600">${eta('e')}</b></div>`:''}</div>`:''}</section>`;
}
function histPanel(n0){
  const n=S.all?40:(n0||4),rows=S.log.slice(-n).reverse();
  return `<section class="card"><div class="ch"><span>HISTORY</span><span>${S.all?'全件表示中':'直近'+Math.min(n,S.log.length)+'件'}・「履歴」で切替</span></div>`+
  (rows.length?rows.map(e=>{const d=new Date(e.t);return `<div class="h"><span><small>${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}</small><u>${CUR[e.c||'f']}</u>${esc(e.n||'')}</span><em class="${e.a>0?'up':'dn'}">${sg(e.a)}</em></div>`}).join(''):'<div class="empty">まだ記録がありません</div>')+`</section>`;
}
let sheetOpen=false;
function sheetHTML(){
  const inp=(a,l,v)=>`<label>${l}<input type="number" inputmode="numeric" min="0" ${a} value="${v||''}" placeholder="0"></label>`;
  return `<div class="sh-h"><b>設定</b><span class="mu">量はレベルに合わせて入力</span><span id="shx">✕</span></div>
  <div class="src"><div class="sn"><b>使い始めの量</b><small>このサイトを使い始めた時点</small></div><div class="sf">${inp('data-o="f"','ファンス',S.open.f)}${inp('data-o="e"','円石',S.open.e)}${inp('data-o="w"','財力値',S.open.w)}</div></div>
  <div class="src"><div class="sn"><b>目標</b></div><div class="sf">${inp('data-g="f"','ファンス',S.goals.f)}${inp('data-g="e"','円石',S.goals.e)}</div></div>`+
  S.src.map(s=>{const nx=nextDue(s);return `<div class="src"><div class="sn"><b>${s.n}</b><small>${s.lb}${nx?'・次回 '+nx:''}</small></div><div class="sf">${inp(`data-s="${s.id}" data-k="f"`,'ファンス',s.f)}${inp(`data-s="${s.id}" data-k="e"`,'円石',s.e)}${s.t==='b'?`<label>基準日（受取の月曜）<input type="date" data-s="${s.id}" data-k="anchor" value="${s.anchor}"></label>`:''}</div></div>`}).join('');
}
function renderSheet(){const sh=$('#sheet'),st=sh.scrollTop;sh.innerHTML=sheetHTML();sh.scrollTop=st}
function openSheet(o){sheetOpen=o;if(o)renderSheet();$('#shw').classList.toggle('open',o)}
$('#shbd').onclick=()=>openSheet(false);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='shx')openSheet(false)});
$('#sheet').addEventListener('change',e=>{const t=e.target,v=Math.max(0,Math.round(+t.value||0));
  if(t.dataset.o){S.open[t.dataset.o]=v;S.open.set=true}
  else if(t.dataset.g){S.goals[t.dataset.g]=v}
  else{const s=S.src.find(x=>x.id===t.dataset.s);if(!s)return;if(t.dataset.k==='anchor'){if(t.value)s.anchor=t.value}else s[t.dataset.k]=v}
  save();renderDash()});
function renderDash(){
  const D=$('#dash'),st=D.scrollTop;D.style.removeProperty('--ch');
  let hn=4;D.innerHTML=card()+fcCard()+histPanel(hn);
  if(!S.all)while(D.scrollHeight>D.clientHeight+1&&hn>1){hn--;D.innerHTML=card()+fcCard()+histPanel(hn)}
  {const ov=D.scrollHeight-D.clientHeight,sv=D.querySelector('svg.ch2');if(!S.all&&ov>1&&sv)D.style.setProperty('--ch',Math.max(64,Math.floor(sv.getBoundingClientRect().height-ov))+'px')}
  D.scrollTop=st;
  ['f','e'].forEach(c=>{
    const to=bal(c),from=shown[c],el=$('#bv_'+c),t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=nf(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f);else shown[c]=to})(t0);
  });
  if(!D.classList.contains('na'))setTimeout(()=>D.classList.add('na'),900);
  requestAnimationFrame(()=>requestAnimationFrame(()=>D.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%')));
}
function render(){renderDash();if(sheetOpen)renderSheet()}
const clock=()=>{const d=new Date(),p=x=>String(x).padStart(2,'0');$('#dt').textContent=`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};
clock();setInterval(clock,20000);

/* ---- 一時チャット(処理が終わると消える) ---- */
const L=$('#log');let fadeT;
function fadeAll(){L.querySelectorAll('.m:not(.out)').forEach(m=>{m.classList.add('out');setTimeout(()=>m.remove(),480)})}
function bubble(r,h){const d=document.createElement('div');d.className='m '+r;d.innerHTML=h;L.appendChild(d);return d}
function user(t){bubble('u',esc(t))}
function bot(h,o={}){
  const d=bubble('a','<span class="dots"><i></i><i></i><i></i></span>');
  setTimeout(()=>{d.innerHTML=h;if(!o.keep)fadeT=setTimeout(fadeAll,o.ms||2400)},420);
}
const help=()=>`<b>+5000 ボス報酬</b>　入手<br><b>-3000 ガチャ</b>　消費<br><b>円石 +300</b>　円石は「円石」を付ける<br><b>セット ファンス 50000 円石 300 財力値 1000000</b>　使い始めの量<br><b>全画面</b>　全画面表示の切替<br><b>設定</b>　定期収入・目標の入力<br><span class="mu">符号なしは聞き返します</span>`;

const norm=s=>s.replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/(^|\s)[−ー‐–](?=\s*\d)/g,'$1-').replace(/＋/g,'+').replace(/　/g,' ').trim();
const curOf=t=>/円石|えんせき/.test(t)?'e':'f';
const strip=t=>t.replace(/円石|えんせき|ファンス|ふぁんす/g,' ');
function amt(t){
  const m=t.match(/([+\-])?\s*(\d[\d,]*(?:\.\d+)?)\s*(万|千|k)?/i);if(!m)return null;
  const mul=m[3]==='万'?1e4:(m[3]==='千'||/k/i.test(m[3]||''))?1e3:1;
  return {v:Math.round(parseFloat(m[2].replace(/,/g,''))*mul),sign:m[1]||'',rest:(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim()};
}
function record(c,v,note){
  const before=bal(c),g=S.goals[c];
  S.log.push({id:Date.now(),c,a:v,n:note,t:Date.now()});save();render();
  let h=`${CUR[c]} <span class="${v>0?'up':'dn'}">${sg(v)}</span> を記録${note?`<span class="mu">　${esc(note)}</span>`:''}`,ms=2200;
  if(g>0&&before<g&&bal(c)>=g){h+='<br>目標達成です。';ms=3600}
  if(bal(c)<0){h+='<br><span class="mu">残高がマイナスです。入力を確認してください。</span>';ms=4200}
  bot(h,{ms});
}
const INC=/入手|獲得|もらっ|貰|収入|入金|稼|報酬|ドロップ|売却|売っ|増/,EXP=/使[っい]|消費|購入|買|ガチャ|支出|出金|課金|払|減/;
let pending=null;
function handle(raw){
  const t=norm(raw);if(!t)return;
  clearTimeout(fadeT);fadeAll();user(raw);
  if(pending){
    const p=pending;
    if(p.type==='sign'){
      if(/入手|獲得|増|プラス|^\+/.test(t)){pending=null;return record(p.c,p.v,p.note)}
      if(/消費|使|減|マイナス|^-/.test(t)){pending=null;return record(p.c,-p.v,p.note)}
    }else if(p.type==='reset'){
      pending=null;
      if(/^(はい|うん|ok|yes|消す|y)/i.test(t)){S.log=[];S.goals={f:0,e:0};S.open={f:0,e:0,w:0,set:false};save();shown.f=shown.e=0;render();return bot('リセットしました。')}
      return bot('キャンセルしました。');
    }
    pending=null;
  }
  if(/^(全画面|フルスクリーン|fullscreen)(オン|on|表示)?$/i.test(t)){fsPref=true;try{localStorage.setItem('nte_fs','1')}catch(e){}
    if(inFS()){exitFS();fsPref=false;try{localStorage.setItem('nte_fs','0')}catch(e){}return bot('全画面を解除しました。')}
    enterFS();setTimeout(()=>bot(inFS()?'全画面にしました。':'このビューアでは全画面にできませんでした。リンクをブラウザで直接開くと使えます。',{ms:3600}),350);return}
  if(/全画面.*(オフ|off|解除|やめ|終了)/i.test(t)){fsPref=false;try{localStorage.setItem('nte_fs','0')}catch(e){}exitFS();return bot('全画面を解除しました。')}
  const om=t.match(/^(セット|せっと|初期値?|開始量|スタート|財力値|財力)\s*(?:設定)?\s*(.*)$/);
  if(om){
    const NUM='(ファンス|円石|財力値)?\\s*(\\d[\\d,]*(?:\\.\\d+)?)\\s*(万|千|k)?(?:\\s*(ファンス|円石|財力値)(?!\\s*\\d))?',rest=om[2];
    if(rest&&new RegExp('^('+NUM+'\\s*)+$','i').test(rest)){
      const re=new RegExp(NUM,'gi'),auto=/^財力/.test(om[1])?['w']:['f','e','w'];let m;
      while((m=re.exec(rest))){if(!m[0])break;const w=m[1]||m[4],c=w?(w==='円石'?'e':w==='財力値'?'w':'f'):(auto.shift()||'f'),mul=m[3]==='万'?1e4:(m[3]==='千'||/k/i.test(m[3]||''))?1e3:1;S.open[c]=Math.round(parseFloat(m[2].replace(/,/g,''))*mul)}
      S.open.set=true;save();render();
      return bot(`使い始めの量をセット：ファンス ${nf(S.open.f)}／円石 ${nf(S.open.e)}／財力値 ${nf(S.open.w||0)}（現在 ${nf(wealth())}）`,{ms:3200});
    }
    openSheet(true);return bot('「セット ファンス 50000 円石 300 財力値 1000000」と送るか、設定の「使い始めの量」に入力してください。',{ms:4800});
  }
  if(/^(設定|設定を開く|設定画面|定期|定期収入|settings?)$/i.test(t)){openSheet(true);return bot('設定を開きました。',{ms:1600})}
  if(/^(閉じる|とじる|完了|設定終了|close)$/i.test(t)){openSheet(false);return bot('閉じました。',{ms:1200})}
  if(!/^[+\-]/.test(t)){
    for(const s of S.src){const key=[s.n,...s.k].map(norm).find(k=>t.startsWith(k));if(!key)continue;
      const rest=t.slice(key.length).replace(/^\s*(設定|は)?\s*/,'');
      if(/^(受取|受け取|もらっ|受領|獲得)/.test(rest)){
        if(!(s.f>0||s.e>0))return bot(`${s.n}の金額が未設定です。「${s.n} 5000」のように先に設定してください。`,{ms:4200});
        ['f','e'].forEach(c=>{if(s[c]>0)S.log.push({id:Date.now()+(c==='e'?1:0),c,a:s[c],n:s.n,t:Date.now()})});
        save();render();return bot(`${s.n} を受取：ファンス <span class="up">+${nf(s.f)}</span>／円石 <span class="up">+${nf(s.e)}</span>`);
      }
      const dm=rest.match(/^(?:基準日|次回|開始)?\s*(\d{1,2})\/(\d{1,2})$/);
      if(dm&&s.t==='b'){s.anchor=new Date().getFullYear()+'-'+p2(+dm[1])+'-'+p2(+dm[2]);save();render();return bot(`${s.n}の基準日を ${+dm[1]}/${+dm[2]} にしました。以後14日ごとです。`,{ms:3200})}
      const NUM='(ファンス|円石|財力値)?\\s*(\\d[\\d,]*(?:\\.\\d+)?)\\s*(万|千|k)?(?:\\s*(ファンス|円石|財力値)(?!\\s*\\d))?';
      if(rest&&new RegExp('^('+NUM+'\\s*)+$','i').test(rest)){
        const re=new RegExp(NUM,'gi');let m;
        while((m=re.exec(rest))){if(!m[0])break;const c=(m[1]||m[4])==='円石'?'e':'f',mul=m[3]==='万'?1e4:(m[3]==='千'||/k/i.test(m[3]||''))?1e3:1;s[c]=Math.round(parseFloat(m[2].replace(/,/g,''))*mul)}
        save();render();return bot(`${s.n} を設定：ファンス ${nf(s.f)}／円石 ${nf(s.e)}`,{ms:3200});
      }
      break;
    }
  }
  const c=curOf(t),u=strip(t);
  if(/^(残高|所持|確認|いくら)/.test(t)||/^(残高|所持)/.test(u.trim()))return bot('残高は上に表示しています。');
  if(/履歴|ログ|history/i.test(t)){S.all=!S.all;render();return bot(S.all?'履歴を全件表示にしました。':'履歴を通常表示に戻しました。')}
  if(/集計|まとめ/.test(t)&&!/^\s*[+\-]?\d/.test(u))return bot('集計は各カードに表示しています。');
  if(/取り消|取消|undo|戻す|やり直/i.test(t)){const e=S.log.pop();save();render();return bot(e?`${CUR[e.c||'f']} <b>${sg(e.a)}</b> を取り消しました。`:'取り消せる記録がありません。')}
  if(/^目標/.test(u.trim())){const a=amt(u.replace(/^\s*目標/,''));if(!a)return bot('「目標 100000」「目標 円石 3000」のように入力してください。',{ms:4000});S.goals[c]=a.v;save();render();return bot(`${CUR[c]}の目標を <b>${nf(a.v)}</b> に設定しました。`)}
  if(/リセット|全消|初期化/.test(t)){pending={type:'reset'};return bot('全ての記録を消します。よろしければ「はい」と送ってください。',{keep:true})}
  if(/ヘルプ|使い方|help|^\?$/i.test(t))return bot(help(),{ms:7000});
  const a=amt(u);
  if(a&&a.v>0){
    const note=a.rest.replace(/^(を|が|で)\s*/,'').slice(0,24);
    if(a.sign==='+'||(!a.sign&&INC.test(t)&&!EXP.test(t)))return record(c,a.v,note);
    if(a.sign==='-'||(!a.sign&&EXP.test(t)&&!INC.test(t)))return record(c,-a.v,note);
    pending={type:'sign',c,v:a.v,note};
    return bot(`${CUR[c]} <b>${nf(a.v)}</b> は入手ですか？消費ですか？<div class="mu">「入手」か「消費」と送ってください</div>`,{keep:true});
  }
  bot('読み取れませんでした。<br>'+help(),{ms:6000});
}
$('#send').onclick=()=>{const v=$('#q').value;$('#q').value='';handle(v)};
$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('#send').click()};
render();
if(!S.open.set&&!S.log.length)setTimeout(()=>bot('はじめに、使い始めの量を入力してください。<br><b>セット ファンス 50000 円石 300 財力値 1000000</b>',{keep:true}),500);
/* ---- 全画面 ---- */
let fsPref=true,fsTried=false;try{fsPref=localStorage.getItem('nte_fs')!=='0'}catch(e){}
const inFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
function enterFS(){const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(!f||inFS())return;try{const r=f.call(e);if(r&&r.catch)r.catch(()=>{})}catch(x){}}
function exitFS(){const d=document;try{(d.exitFullscreen||d.webkitExitFullscreen||(()=>{})).call(d)}catch(x){}}
document.addEventListener('click',()=>{if(fsPref&&!fsTried&&!inFS()){fsTried=true;enterFS()}});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(renderDash,160)});
</script>
</body>
</html>
