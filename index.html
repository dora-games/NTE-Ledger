<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTE Ledger</title>
<style>
:root{--bg:#1D1D1D;--p:#242424;--p2:#282828;--line:#343434;--tx:#f2f2f2;--mu:#858585;--dn:#a3a3a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#wm{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
#wm img{display:none;width:min(64vw,380px);height:auto;opacity:.08;filter:grayscale(1)}
body.hasl #wm img{display:block}
#app{position:relative;z-index:1;height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
.tl{display:flex;align-items:center;gap:11px}
.lg{cursor:pointer;display:block;flex:none}
.lg img{display:none;width:36px;height:36px;object-fit:contain}
.lg.has img{display:block}.lg.has .ph{display:none}
.ph{width:36px;height:36px;border:1px dashed #555;border-radius:10px;display:grid;place-items:center;font-size:8px;letter-spacing:.08em;color:#6a6a6a}
.title{font-weight:700;font-size:20px;letter-spacing:.02em}
#dt{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
#dash{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-content:start}
.card{background:#242424d9;border:1px solid var(--line);border-radius:20px;padding:15px 16px;backdrop-filter:blur(6px);animation:in .5s both}
.card:nth-child(2){animation-delay:.08s}
.full{grid-column:1/-1}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:var(--mu)}
.dl{letter-spacing:0;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:#fff;font-weight:700}.dn{color:var(--dn);font-weight:700}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0 4px}
svg.ch2{width:100%;height:auto;display:block;margin:4px 0 8px;overflow:visible}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s .15s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.nochart{height:84px;display:grid;place-items:center;color:#5f5f5f;font-size:12px;margin:4px 0 8px;border:1px dashed var(--line);border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.bl{font-size:11px;color:var(--mu);letter-spacing:.1em}
.lgd{display:flex;gap:16px;font-size:11px;color:var(--mu)}
.lgd i{display:inline-block;width:16px;border-top:2px solid;vertical-align:middle;margin-right:5px}
.tbl{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px 10px;font-size:12px;color:var(--mu);margin:4px 0 14px}
.tbl b{color:var(--tx);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tbl .hd{text-align:right;font-size:10px;letter-spacing:.1em}
.gls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 0}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.h{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.h:last-child{border:0}.h span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h small{color:var(--mu);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.h u{text-decoration:none;font-size:10px;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px}
.h em{font-style:normal;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hint{color:#6a6a6a;font-size:11px;line-height:1.8;text-align:center;padding:4px 8px}
.empty{color:#5f5f5f;text-align:center;padding:14px 0;font-size:12px}
/* ephemeral chat */
#log{position:absolute;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:0 16px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.m{max-width:88%;word-break:break-word;animation:pop .35s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:0 8px 24px #0006}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.m.out{animation:out .45s ease forwards}
@keyframes out{to{opacity:0;transform:translateY(-8px) scale(.97)}}
.m.a{align-self:flex-start;background:#2c2c2c;border:1px solid #3c3c3c;padding:10px 14px;border-radius:6px 18px 18px 18px}
.m.u{align-self:flex-end;background:#f2f2f2;color:#1D1D1D;font-weight:600;padding:8px 15px;border-radius:18px 18px 6px 18px}
.mu{color:var(--mu);font-size:12px}
.dots i{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:#aaa;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
.inp{display:flex;gap:10px;padding:8px 16px 14px;align-items:center;position:relative;z-index:6}
input{flex:1;min-width:0;background:var(--p2);border:1px solid #333;color:var(--tx);border-radius:26px;padding:14px 20px;font:inherit;transition:border-color .2s}
input::placeholder{color:#6d6d6d}
input:focus{outline:0;border-color:#666}
#send{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;background:#f2f2f2;color:#1D1D1D;flex:none;display:grid;place-items:center}
#send:active{transform:scale(.9)}
#send svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="wm"><img id="wmi" alt=""></div>
<div id="app">
  <div class="top"><div class="tl"><label class="lg" id="lg" title="タップでロゴ画像を選択"><input type="file" accept="image/*" id="lf" hidden><img id="lgi" alt=""><span class="ph">LOGO</span></label><div class="title">NTE Ledger</div></div><div id="dt"></div></div>
  <div id="dash"></div>
  <div id="log"></div>
  <div class="inp"><input id="q" placeholder="例: +5000 ボス報酬 / 円石 -300 ガチャ" enterkeyhint="send" autocomplete="off"><button id="send" aria-label="送信"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n).toLocaleString('ja-JP');
const sg=n=>(n>0?'+':n<0?'−':'')+nf(Math.abs(n));
const CUR={f:'ファンス',e:'円石'},COL={f:'#ffffff',e:'#b9b9b9'};
let S={v:4,log:[],goals:{f:0,e:0},all:false};
try{const r=JSON.parse(localStorage.getItem('nte_fans')||'null');if(r){S.log=r.log||[];S.goals=r.goals||{f:r.goal||0,e:0}}}catch(e){}
const save=()=>{try{localStorage.setItem('nte_fans',JSON.stringify({v:4,log:S.log,goals:S.goals}))}catch(e){}};
const of=c=>S.log.filter(e=>(e.c||'f')===c);
const bal=c=>of(c).reduce((a,e)=>a+e.a,0);
const sum=(a,p)=>a.filter(p).reduce((x,e)=>x+e.a,0);
const shown={f:0,e:0};
const isToday=e=>new Date(e.t).toDateString()===new Date().toDateString();

function chart(){
  let f=0,e=0;const F=[0],E=[0];
  S.log.forEach(x=>{if((x.c||'f')==='f')f+=x.a;else e+=x.a;F.push(f);E.push(e)});
  const n=Math.min(41,F.length),pf=F.slice(-n),pe=E.slice(-n);
  if(n<2)return '<div class="nochart">記録するとグラフが表示されます</div>';
  const W=300,H=96,pd=6,X=i=>pd+i*(W-pd*2)/(n-1);
  const mk=(p,c)=>{const g=S.goals[c];let mx=Math.max(...p,g>0?g:-Infinity),mn=Math.min(...p,0);if(mx===mn)mx=mn+1;const Y=v=>H-pd-(v-mn)/(mx-mn)*(H-pd*2);return {Y,mx,g,d:p.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(''),ly:Y(p[p.length-1])}};
  const A=mk(pf,'f'),B=mk(pe,'e'),lx=X(n-1);
  return `<svg class="ch2" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  ${A.g>0?`<line x1="0" x2="${W}" y1="${A.Y(A.g)}" y2="${A.Y(A.g)}" stroke="#fff" stroke-opacity=".3" stroke-dasharray="3 4"/>`:''}
  ${B.g>0?`<line x1="0" x2="${W}" y1="${B.Y(B.g)}" y2="${B.Y(B.g)}" stroke="#aaa" stroke-opacity=".3" stroke-dasharray="1 4"/>`:''}
  <path d="${A.d}L${lx} ${H}L${X(0)} ${H}Z" fill="url(#gf)"/>
  <path class="ln" pathLength="1" d="${A.d}" stroke="#fff"/>
  <path class="ln" pathLength="1" d="${B.d}" stroke="#a8a8a8" style="stroke-dasharray:.04 .02;animation:none;stroke-dashoffset:0;stroke-width:1.8"/>
  <circle cx="${lx}" cy="${A.ly}" r="3.5" fill="#fff"/><circle cx="${lx}" cy="${A.ly}" r="7" fill="#fff" opacity=".16"/>
  <circle cx="${lx}" cy="${B.ly}" r="3" fill="#a8a8a8"/></svg>
  <div class="lgd"><span><i style="border-color:#fff"></i>ファンス 最大 ${nf(A.mx)}</span><span><i style="border-color:#a8a8a8;border-top-style:dashed"></i>円石 最大 ${nf(B.mx)}</span></div>`;
}
function card(){
  const D={};['f','e'].forEach(c=>{const a=of(c),td=a.filter(isToday);D[c]={b:bal(c),net:td.reduce((x,y)=>x+y.a,0),ti:sum(td,x=>x.a>0),to:-sum(td,x=>x.a<0),ai:sum(a,x=>x.a>0),ao:-sum(a,x=>x.a<0),g:S.goals[c]}});
  const pc=c=>D[c].g>0?Math.max(0,Math.min(100,Math.round(D[c].b/D[c].g*100))):0;
  const gl=c=>`<div><div class="gl"><span>${CUR[c]} ${D[c].g>0?'目標 '+nf(D[c].g):'目標なし'}</span><span>${D[c].g>0?pc(c)+'%':''}</span></div><div class="bar"><i data-w="${pc(c)}"></i></div></div>`;
  const row=(l,k)=>`<span>${l}</span><b>${nf(D.f[k])}</b><b>${nf(D.e[k])}</b>`;
  return `<section class="card full"><div class="ch"><span>BALANCE</span><span class="dl">今日 ${D.f.net?sg(D.f.net):'±0'} ／ ${D.e.net?sg(D.e.net):'±0'}</span></div>
  <div class="two"><div><div class="bl">ファンス</div><div class="big" id="bv_f">${nf(shown.f)}</div></div><div><div class="bl">円石</div><div class="big" id="bv_e">${nf(shown.e)}</div></div></div>
  ${chart()}
  <div class="tbl"><span></span><b class="hd">ファンス</b><b class="hd">円石</b>${row('今日 入手','ti')}${row('今日 消費','to')}${row('累計 入手','ai')}${row('累計 消費','ao')}</div>
  <div class="gls">${gl('f')}${gl('e')}</div></section>`;
}
function histPanel(){
  const n=S.all?40:8,rows=S.log.slice(-n).reverse();
  const p=x=>String(x).padStart(2,'0');
  return `<section class="card full"><div class="ch"><span>HISTORY</span><span>${S.all?'全件表示中':'直近8件'}・「履歴」で切替</span></div>`+
  (rows.length?rows.map(e=>{const d=new Date(e.t);return `<div class="h"><span><small>${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}</small><u>${CUR[e.c||'f']}</u>${esc(e.n||'')}</span><em class="${e.a>0?'up':'dn'}">${sg(e.a)}</em></div>`}).join(''):'<div class="empty">まだ記録がありません</div>')+`</section>`;
}
function render(){
  const D=$('#dash'),st=D.scrollTop;
  D.innerHTML=card()+histPanel()+'<div class="hint full">+5000 ボス報酬 ／ -3000 ガチャ ／ 円石 +300 ／ 1.2万 売却<br>取り消し ／ 目標 100000 ／ 目標 円石 3000 ／ 履歴 ／ リセット</div>';
  D.scrollTop=st;
  ['f','e'].forEach(c=>{
    const to=bal(c),from=shown[c],el=$('#bv_'+c),t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=nf(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f);else shown[c]=to})(t0);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>D.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%')));
}
const clock=()=>{const d=new Date(),p=x=>String(x).padStart(2,'0');$('#dt').textContent=`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};
clock();setInterval(clock,20000);

/* ---- 一時チャット(処理が終わると消える) ---- */
const L=$('#log');let fadeT;
function fadeAll(){L.querySelectorAll('.m:not(.out)').forEach(m=>{m.classList.add('out');setTimeout(()=>m.remove(),480)})}
function bubble(r,h){const d=document.createElement('div');d.className='m '+r;d.innerHTML=h;L.appendChild(d);return d}
function user(t){bubble('u',esc(t))}
function bot(h,o={}){
  const d=bubble('a','<span class="dots"><i></i><i></i><i></i></span>');
  setTimeout(()=>{d.innerHTML=h;if(!o.keep)fadeT=setTimeout(fadeAll,o.ms||2400)},420);
}
const help=()=>`<b>+5000 ボス報酬</b>　入手<br><b>-3000 ガチャ</b>　消費<br><b>円石 +300</b>　円石は「円石」を付ける<br><span class="mu">符号なしは聞き返します</span>`;

const norm=s=>s.replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[−ー‐–]/g,'-').replace(/＋/g,'+').replace(/　/g,' ').trim();
const curOf=t=>/円石|えんせき/.test(t)?'e':'f';
const strip=t=>t.replace(/円石|えんせき|ファンス|ふぁんす/g,' ');
function amt(t){
  const m=t.match(/([+\-])?\s*(\d[\d,]*(?:\.\d+)?)\s*(万|千|k)?/i);if(!m)return null;
  const mul=m[3]==='万'?1e4:(m[3]==='千'||/k/i.test(m[3]||''))?1e3:1;
  return {v:Math.round(parseFloat(m[2].replace(/,/g,''))*mul),sign:m[1]||'',rest:(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim()};
}
function record(c,v,note){
  const before=bal(c),g=S.goals[c];
  S.log.push({id:Date.now(),c,a:v,n:note,t:Date.now()});save();render();
  let h=`${CUR[c]} <span class="${v>0?'up':'dn'}">${sg(v)}</span> を記録${note?`<span class="mu">　${esc(note)}</span>`:''}`,ms=2200;
  if(g>0&&before<g&&bal(c)>=g){h+='<br>目標達成です。';ms=3600}
  if(bal(c)<0){h+='<br><span class="mu">残高がマイナスです。入力を確認してください。</span>';ms=4200}
  bot(h,{ms});
}
const INC=/入手|獲得|もらっ|貰|収入|入金|稼|報酬|ドロップ|売却|売っ|増/,EXP=/使[っい]|消費|購入|買|ガチャ|支出|出金|課金|払|減/;
let pending=null;
function handle(raw){
  const t=norm(raw);if(!t)return;
  clearTimeout(fadeT);fadeAll();user(raw);
  if(pending){
    const p=pending;
    if(p.type==='sign'){
      if(/入手|獲得|増|プラス|^\+/.test(t)){pending=null;return record(p.c,p.v,p.note)}
      if(/消費|使|減|マイナス|^-/.test(t)){pending=null;return record(p.c,-p.v,p.note)}
    }else if(p.type==='reset'){
      pending=null;
      if(/^(はい|うん|ok|yes|消す|y)/i.test(t)){S.log=[];S.goals={f:0,e:0};save();shown.f=shown.e=0;render();return bot('リセットしました。')}
      return bot('キャンセルしました。');
    }
    pending=null;
  }
  if(/ロゴ.*(削除|消|リセット)/.test(t)){clearLogo();return bot('ロゴを削除しました。')}
  const c=curOf(t),u=strip(t);
  if(/^(残高|所持|確認|いくら)/.test(t)||/^(残高|所持)/.test(u.trim()))return bot('残高は上に表示しています。');
  if(/履歴|ログ|history/i.test(t)){S.all=!S.all;render();return bot(S.all?'履歴を全件表示にしました。':'履歴を直近8件に戻しました。')}
  if(/集計|まとめ/.test(t)&&!/^\s*[+\-]?\d/.test(u))return bot('集計は各カードに表示しています。');
  if(/取り消|取消|undo|戻す|やり直/i.test(t)){const e=S.log.pop();save();render();return bot(e?`${CUR[e.c||'f']} <b>${sg(e.a)}</b> を取り消しました。`:'取り消せる記録がありません。')}
  if(/^目標/.test(t)){const a=amt(u.replace(/^目標/,''));if(!a)return bot('「目標 100000」「目標 円石 3000」のように入力してください。',{ms:4000});S.goals[c]=a.v;save();render();return bot(`${CUR[c]}の目標を <b>${nf(a.v)}</b> に設定しました。`)}
  if(/リセット|全消|初期化/.test(t)){pending={type:'reset'};return bot('全ての記録を消します。よろしければ「はい」と送ってください。',{keep:true})}
  if(/ヘルプ|使い方|help|^\?$/i.test(t))return bot(help(),{ms:7000});
  const a=amt(u);
  if(a&&a.v>0){
    const note=a.rest.replace(/^(を|が|で)\s*/,'').slice(0,24);
    if(a.sign==='+'||(!a.sign&&INC.test(t)&&!EXP.test(t)))return record(c,a.v,note);
    if(a.sign==='-'||(!a.sign&&EXP.test(t)&&!INC.test(t)))return record(c,-a.v,note);
    pending={type:'sign',c,v:a.v,note};
    return bot(`${CUR[c]} <b>${nf(a.v)}</b> は入手ですか？消費ですか？<div class="mu">「入手」か「消費」と送ってください</div>`,{keep:true});
  }
  bot('読み取れませんでした。<br>'+help(),{ms:6000});
}
$('#send').onclick=()=>{const v=$('#q').value;$('#q').value='';handle(v)};
$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('#send').click()};
render();

/* ---- ロゴ ---- */
function setLogo(src){$('#lgi').src=src;$('#wmi').src=src;$('#lg').classList.add('has');document.body.classList.add('hasl')}
function clearLogo(){$('#lg').classList.remove('has');document.body.classList.remove('hasl');try{localStorage.removeItem('nte_logo')}catch(e){}}
(function(){let st=null;try{st=localStorage.getItem('nte_logo')}catch(e){}
  if(st)setLogo(st);else{const t=new Image();t.onload=()=>setLogo('logo.png');t.src='logo.png'}})();
$('#lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/png');try{localStorage.setItem('nte_logo',u)}catch(x){}setLogo(u)};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
</script>
</body>
</html>
