<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>NTE Ledger</title>
<style>
:root{--bg:#1D1D1D;--p:#242424;--p2:#282828;--line:#343434;--tx:#f2f2f2;--mu:#9a9a9a;--dn:#a3a3a3;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sal:env(safe-area-inset-left,0px);--sab:max(env(safe-area-inset-bottom,0px),14px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#wm{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
#wm img{display:block;width:min(50vw,270px);height:auto;opacity:.13}
body.hasl #wm img{display:block}
#app{position:relative;z-index:1;height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
.tl{display:flex;align-items:center;gap:11px}
.lg{display:block;flex:none}

.title{font-weight:700;font-size:20px;letter-spacing:.02em}
#dt{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
#dash,#ghost{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 8px;display:grid;grid-template-columns:1fr;gap:9px;align-content:start}
.card{background:#242424a8;border:1px solid var(--line);border-radius:20px;padding:15px 16px;animation:in .62s cubic-bezier(.2,.9,.3,1) both}
.full{grid-column:1/-1}
@keyframes in{0%{opacity:0;transform:translate(var(--cx,0px),16px) scale(.975)}55%{opacity:1;transform:translate(0,-2px) scale(1.004)}100%{opacity:1;transform:none}}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:var(--mu)}
.dl{letter-spacing:0;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:#fff;font-weight:700}.dn{color:var(--dn);font-weight:700}

svg.ch2{width:100%;height:auto;display:block;margin:4px 0 8px;overflow:visible}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s cubic-bezier(.3,.7,.2,1) calc(var(--fxd,0s) + .15s) forwards}

.nochart{height:84px;display:grid;place-items:center;color:#5f5f5f;font-size:12px;margin:4px 0 8px;border:1px dashed var(--line);border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.bl{font-size:11px;color:var(--mu);letter-spacing:.1em}
.lgd{display:flex;gap:16px;font-size:11px;color:var(--mu)}

.tbl{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px 10px;font-size:12px;color:var(--mu);margin:4px 0 14px}

.tbl .hd{text-align:right;font-size:10px;letter-spacing:.1em}
.gls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ax{font-size:8px;fill:#777}
#dash.na .card{animation:none}
.src{padding:9px 0;border-bottom:1px solid #ffffff0d}.src:last-child{border:0}
.sn b{font-size:13px}.sn small{color:var(--mu);font-size:11px;margin-left:8px}
.sf{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 0}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.h{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.h:last-child{border:0}.h span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hint{color:#6a6a6a;font-size:11px;line-height:1.8;text-align:center;padding:4px 8px}
.empty{color:#5f5f5f;text-align:center;padding:14px 0;font-size:12px}
#log{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 62px + var(--kl,0px));padding:0 16px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.m{max-width:88%;word-break:break-word;animation:pop .35s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:0 8px 24px #0006}

.mu{color:var(--mu);font-size:12px}
.dots i{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:#aaa;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
.inp{display:flex;gap:10px;padding:8px 16px 4px;align-items:center;position:relative;z-index:6}
input{flex:1;min-width:0;background:var(--p2);border:1px solid #333;color:var(--tx);border-radius:26px;padding:14px 20px;font:inherit;transition:border-color .2s}
input::placeholder{color:#6d6d6d}
input:focus{outline:0;border-color:#666}
#send{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;background:#f2f2f2;color:#1D1D1D;flex:none;display:grid;place-items:center}
#send:active{transform:scale(.9)}
#send svg{width:20px;height:20px}
.card{padding:12px 14px}
#dash,#ghost{gap:10px;padding:2px 14px 10px}
.big{font-size:28px;margin:0 0 2px}
.two{margin-top:2px}
svg.ch2{margin:2px 0 4px}
.lgd{margin-bottom:8px;flex-wrap:nowrap;gap:2px 9px;white-space:nowrap}
.tbl{gap:4px 10px;margin:6px 0 6px}
.h{padding:5px 0}
.inp{z-index:9}
#log{z-index:8}
#shw{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none;transition:opacity .16s}
#shw.open{opacity:1;pointer-events:auto}
#shbd{position:absolute;inset:0;background:#000a;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 66px + var(--kl,0px));max-height:calc(100% - var(--sab) - var(--sat) - 120px - var(--kl,0px));overflow-y:auto;background:#262626;border:1px solid #3a3a3a;border-radius:22px;padding:14px 16px 8px;transform:translateY(26px) scale(.97);transition:transform .38s cubic-bezier(.2,.9,.3,1.1)}
#shw.open #sheet{transform:none}
.sh-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sh-h b{font-size:15px}.sh-h .mu{flex:1}
#shx{color:var(--mu);font-size:16px;cursor:pointer;padding:0 4px}
@media (max-height:2000px){
.top{padding:8px 16px 4px}.title{font-size:17px}.lg img{width:34px;height:34px}

.card{padding:9px 12px;border-radius:16px}
.big{font-size:23px;margin:0}.bl{font-size:10px}
svg.ch2{margin:0 0 2px}
.lgd{margin-bottom:5px;font-size:9.5px}
.tbl{gap:2px 10px;font-size:11.5px;margin:4px 0 4px}

.gl{font-size:10px}
.inp{padding:6px 12px 4px}
input{padding:11px 16px}#send{width:44px;height:44px}

}

.ci{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:4px}

.pl{font-weight:400;color:var(--mu);font-size:10.5px}
.fct{display:grid;grid-template-columns:44px repeat(var(--n),1fr);gap:0;margin:8px 0 6px;font-variant-numeric:tabular-nums}

.fct .lr{border-bottom:0}
.gls.one{grid-template-columns:1fr}
.slim{padding:9px 14px}.slim .h{padding:0;border:0;font-size:12.5px}
.fct .fh{font-size:10px;letter-spacing:.04em;color:var(--mu);text-align:right;padding:2px 0 7px;display:flex;justify-content:flex-end;align-items:center;gap:5px;white-space:nowrap}
.fct .fh i{display:inline-block;width:14px;height:3px;border-radius:2px}
.fct .fl{font-size:11px;color:var(--mu);display:flex;align-items:center}
.fct b{display:flex;align-items:center;justify-content:flex-end}
.fct b{font-weight:600;font-size:13px;text-align:right;white-space:nowrap;padding-left:8px}
.fct .fh{padding-left:8px}
.fct b.avg{color:var(--mu);font-weight:500;font-size:12px}
.fct .em{font-size:13.5px;font-weight:700}.fct .fl.em{color:var(--tx);font-weight:600;font-size:11px}
.fct small{color:var(--mu);font-weight:400;font-size:10px;margin-left:4px}
@media (max-height:2000px){.fct>*{padding:3.5px 0}.fct .fh{padding:1px 0 4px}.fct{margin:5px 0 4px}}
html,body{overscroll-behavior:none}
@supports (height:100dvh){html,body,#app{height:100dvh}}
.cw{position:relative}
.av{position:absolute;left:14px;top:2px;font-size:10px;line-height:1.5;color:var(--mu);pointer-events:none;padding:2px 12px 3px 4px;border-radius:8px;background:linear-gradient(90deg,#1d1d1dd9 70%,#1d1d1d00)}

.bk{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.bt{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;color:var(--mu);padding:4px 0 2px}
.bt b{color:var(--tx);font-weight:600;font-size:11px;letter-spacing:0;font-variant-numeric:tabular-nums}
.br{position:relative;display:flex;justify-content:space-between;gap:8px;padding:4px 0 6px;font-size:12px;font-variant-numeric:tabular-nums}

.nm{flex:1;min-width:0;font-size:12.5px;line-height:1.35;font-weight:600}

const e=good.filter(isE).sort((a,b)=>b.blue-a.blue)[0];
const f=good.filter(o=>o!==e&&isF(o)).sort((a,b)=>a.gold-b.gold)[0];
const bt=good.filter(o=>o!==e&&o!==f&&isB(o)).sort((a,b)=>b.gold-a.gold)[0];
const fail=[];if(!e&&bad.some(isE))fail.push('e');if(!f&&bad.some(isF))fail.push('f');if(!bt&&bad.some(isB))fail.push('b');
return {ok:!!(e||f||bt)||wv!=null,f:f?f.val:null,e:e?e.val:null,b:bt?bt.val:null,w:wv,fail,groups:out};
}
function readShot(file){

function shotResult(r){

let shotUndo=null,lastDet=null;
function applyShot(p){

if(first){['f','e','b'].forEach(c=>{if(p[c]!=null)S.open[c]=p[c]});S.open.set=true;ch=true}
else['f','e','b'].forEach((c,i)=>{if(p[c]==null)return;const d=p[c]-bal(c);if(d){S.log.push({id:Date.now()+i,c,a:d,n:'スクショ補正',t:Date.now()});ch=true}});

['f','e','b'].filter(c=>p[c]!=null).forEach(c=>parts.push(`${CUR[c]} <b>${nf(bal(c))}</b>${dl(bal(c),bf[c])}`));
if(p.w!=null)parts.push(`財力値 <b>${nf(wealth())}</b>${dl(wealth(),bf.w)}`);

if(ch)shotUndo={...snap,len:S.log.length};
const note=(p.fail&&p.fail.length)?`<div class="mu">${p.fail.map(c=>CUR[c]).join('・')}は読み取れませんでした</div>`:'';
bot((ch?`反映：${parts.join('／')}<div class="mu">「取り消し」で戻せます${first&&p.w==null?'・財力値は「財力値 1200000」かランキング画面のスクショで入力':''}</div>`:'すでに一致しています。')+note,{ms:first?5000:(note?5200:3800)});
}
$('#shot').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readShot(f)};
document.addEventListener('paste',e=>{const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.indexOf('image/')===0);if(it){e.preventDefault();readShot(it.getAsFile())}});
const EXP_APP='nte-ledger';
const stampNow=()=>{const d=new Date();return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'-'+p2(d.getHours())+p2(d.getMinutes())};
const exportJSON=()=>JSON.stringify({app:EXP_APP,ver:5,exported:new Date().toISOString(),data:snapshot()},null,1);

function doCopy(){

function parseImport(txt){
let o;txt=String(txt).replace(/[\u200B-\u200D\uFEFF]/g,'').trim();const i=txt.indexOf('{'),j=txt.lastIndexOf('}');if(i>0&&j>i)txt=txt.slice(i,j+1);try{o=JSON.parse(txt)}catch(e){return {err:'JSONとして読み取れませんでした。コピーが途中で切れている可能性があります。'}}
const d=o&&o.app===EXP_APP&&o.data&&typeof o.data==='object'?o.data:(o&&Array.isArray(o.log)?o:null);
if(!d)return {err:'NTE Ledgerの書き出しファイルではありません。'};
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x),nn=x=>{x=Math.round(+x);return Number.isFinite(x)?x:0},CS=['f','e','b'];
const log=(Array.isArray(d.log)?d.log:[]).filter(e=>e&&Number.isFinite(+e.a)&&Number.isFinite(+e.t)).map(e=>({id:+e.id||+e.t,c:CS.includes(e.c)?e.c:'f',a:Math.round(+e.a),n:String(e.n||'').slice(0,60),t:+e.t})).sort((x,y)=>x.t-y.t);
const op=isObj(d.open)?d.open:{},open={f:nn(op.f),e:nn(op.e),b:nn(op.b),w:nn(op.w),set:!!op.set||log.length>0};
const gl=isObj(d.goals)?d.goals:{},goals={f:Math.max(0,nn(gl.f)),e:Math.max(0,nn(gl.e))};
const ids=S.src.map(x=>x.id),src=(Array.isArray(d.src)?d.src:[]).filter(x=>x&&ids.includes(x.id)).map(x=>({id:x.id,f:Math.max(0,nn(x.f)),e:Math.max(0,nn(x.e)),b:Math.max(0,nn(x.b)),anchor:/^\d{4}-\d{2}-\d{2}$/.test(x.anchor||'')?x.anchor:undefined}));
const out={v:5,mig:1,fcMode:['auto','obs','sched','blend'].includes(d.fcMode)?d.fcMode:'auto',cs:isObj(d.cs)?d.cs:{},cSort:typeof d.cSort==='string'?d.cSort:'rel',cF:isObj(d.cF)?d.cF:{},ntf:isObj(d.ntf)?d.ntf:undefined,log,goals,open,pull:nn(d.pull)>0?nn(d.pull):160,rcv:isObj(d.rcv)?d.rcv:{},src};
return {out,exported:o.exported};
}
function askImport(txt){
const r=parseImport(txt);
if(r.err)return bot(r.err+'<div class="mu">「書き出し」で保存したjsonファイルを選んでください。</div>',{ms:4800});
const o=r.out,b=c=>(o.open[c]||0)+o.log.filter(e=>e.c===c).reduce((x,e)=>x+e.a,0),w=(o.open.w||0)+o.log.filter(e=>e.c==='f'&&e.a>0).reduce((x,e)=>x+e.a,0);
const range=o.log.length?`${md(o.log[0].t)}〜${md(o.log[o.log.length-1].t)}`:'記録なし';
pending={type:'imp',obj:o};openSheet(false);clearTimeout(fadeT);fadeAll();
bot(`読み込み内容：記録 ${o.log.length}件（${range}）<div class="mu">ファンス ${nf(b('f'))}／円石 ${nf(b('e'))}${b('b')?`／甲虫コイン ${nf(b('b'))}`:''}／財力値 ${nf(w)}</div>今のデータをすべて置き換えます。よろしければ「はい」と送ってください。<div class="mu">あとから「インポート取り消し」で戻せます</div>`,{keep:true});
}
function applyImport(o){

sessionStorage.setItem('nte_imp','1');
}catch(e){return bot('保存できませんでした（ブラウザの保存容量を確認してください）。',{ms:4800})}

}
function undoImport(){

try{localStorage.setItem('nte_fans',b);localStorage.removeItem('nte_fans_bak');sessionStorage.setItem('nte_imp','undo')}catch(e){return bot('戻せませんでした。',{ms:2800})}

function readImport(file){
clearTimeout(fadeT);fadeAll();
(file.text?file.text():new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ng;r.readAsText(file)})).then(askImport).catch(()=>bot('ファイルを読み込めませんでした。'));
}

document.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;const f=[...(cd.files||[])].find(x=>/json|text/.test(x.type)||/\.json$/i.test(x.name));if(f){e.preventDefault();return readImport(f)}const t=cd.getData('text')||'';if(t.indexOf('nte-ledger')>=0&&t.indexOf('{')>=0){e.preventDefault();askImport(t)}});
try{const f=sessionStorage.getItem('nte_imp');if(f){sessionStorage.removeItem('nte_imp');setTimeout(()=>bot(f==='undo'?'インポート前の状態に戻しました。':'読み込みました。<div class="mu">「インポート取り消し」で元に戻せます</div>',{ms:4600}),700)}}catch(e){}
if(navigator.virtualKeyboard){try{const vk=navigator.virtualKeyboard;vk.overlaysContent=true;document.documentElement.classList.add('vk');const upKb=()=>{const h=Math.round(vk.boundingRect.height);document.documentElement.style.setProperty('--kb',h+'px');document.documentElement.classList.toggle('kbo',h>80)};vk.addEventListener('geometrychange',upKb);upKb()}catch(e){}}
let rzT,pendRefit=false;const refit=()=>{if(document.activeElement&&document.activeElement.id==='q'){pendRefit=true;return}clearTimeout(rzT);rzT=setTimeout(renderDash,160)};$('#q').addEventListener('blur',()=>{if(pendRefit){pendRefit=false;refit()}});addEventListener('resize',refit);addEventListener('orientationchange',refit);if(window.visualViewport)visualViewport.addEventListener('resize',refit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
(()=>{const R=document.documentElement,vv=window.visualViewport;

const upd=()=>{raf=0;const z=vv.scale>1.01;const d=Math.round(innerHeight-vv.height);const kb=(!z&&d>80)?d:0,t=(!z&&kb)?Math.round(vv.offsetTop):0,k=kb+'|'+t;if(k===last)return;last=k;
R.style.setProperty('--kb',kb+'px');R.style.setProperty('--vvt',t+'px');R.classList.toggle('kbo',kb>0)};
const sch=()=>{if(!raf)raf=requestAnimationFrame(upd)};
vv.addEventListener('resize',sch);vv.addEventListener('scroll',sch);addEventListener('focusin',sch);addEventListener('focusout',()=>setTimeout(sch,60));upd()}
if(window.matchMedia){let mq;const on=()=>{w();refit()},w=()=>{if(mq)mq.removeEventListener('change',on);mq=matchMedia('(resolution:'+devicePixelRatio+'dppx)');mq.addEventListener('change',on)};try{w()}catch(e){}}
})();
